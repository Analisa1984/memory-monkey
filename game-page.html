<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap version 5.3.8  CSS link-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dawning+of+a+New+Day&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Momo+Signature&family=Orbitron:wght@400..900&family=Oswald:wght@200..700&family=Quicksand:wght@300..700&family=Stack+Sans+Notch:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dawning+of+a+New+Day&family=DynaPuff:wght@400..700&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Momo+Signature&family=Orbitron:wght@400..900&family=Oswald:wght@200..700&family=Quicksand:wght@300..700&family=Stack+Sans+Notch:wght@200..700&display=swap"
      rel="stylesheet"
    />

    <!-- CSS style sheet link -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Favicon links -->
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/images/favicon/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="assets/images/favicon/favicon-48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="180x180"
      href="assets/images/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="assets/images/favicon/favicon-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="assets/images/favicon/favicon-512x512.png"
    />

    <title>Game Page</title>
  </head>
  <body>
    <!-- Bootstrap version 5.3.8 Navigation Bar -->

    <nav class="navbar navbar-expand-lg bg-body-tertiary py-3 fs-6">
      <div class="container-fluid justify-content-center">
        <a
          class="navbar-brand"
          href="index.html"
          aria-label="clicking on title and monkeys lead to homepage"
        >
          <img
            src="assets/images/game-pics/monkey-pic.jpg"
            alt="memory monkey cartoon"
            width="30"
            height="24"
            class="d-inline-block align-text-top img-fluid"
          />
          Memory Monkey
          <img
            src="assets/images/game-pics/monkey-pic.jpg"
            alt="memory monkey cartoon"
            width="30"
            height="24"
            class="d-inline-block align-text-top img-fluid"
          />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
          <ul class="navbar-nav text-center">
            <li class="nav-item">
              <a
                class="nav-link"
                href="index.html"
                aria-label="clicking home leads to the homepage"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="game-page.html"
                >Play Now</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="main">
      <h1 class="text-center welcome" aria-label="welcome info">
        Welcome to Memory Monkey!
      </h1>
      <div class="text-center">
        <p class="fun" role="contentinfo">Get ready to have fun!</p>

        <!-- This DIV created to show the Rounds of the game -->
        <div id="game-round" role="contentinfo">Round 1</div>
        <div class="container">
          <!-- This DIV created to show the score board -->
          <div id="score-board" role="contentinfo">Score: 0</div>
        </div>

        <!-- this DIV created to stabilize the layout and prevent buttons from shifting when random card disappears -->
        <div id="game-area">
          <!-- This DIV created to show the random cards generated in javascript formula -->
          <div id="random-items-display"></div>

          <br />
          <br />
        </div>
        <div id="user-input">
          <!-- This DIV created to show all the fontawesome buttons -->
          <div id="fontAwesome"></div>

          <div class="container">
            <div>
              <!-- Start Game button -->
              <button
                data-type="start-game"
                aria-label="start-game button"
                id="start-game"
              >
                Start Game
              </button>
            </div>
            <div>
              <!-- Delete button -->
              <button data-type="delete" aria-label="delete button" id="delete">
                Delete
              </button>
            </div>
          </div>

          <!-- This DIV created for user's reply to be shown when buttons clicked -->
          <div id="user-reply"></div>

          <br />
          <div class="container">
            <div>
              <!-- Submit button  -->
              <button
                data-type="submit"
                aria-label="submit button"
                id="user-entry-final"
              >
                Submit
              </button>
            </div>
            <div>
              <!-- New Game button -->
              <button
                data-type="new-game"
                aria-label="new-game button"
                id="new-game"
              >
                New Game
              </button>
            </div>
          </div>
        </div>
        <div id="game-over"></div>
      </div>
    </div>

    <!-- Bootstrap version 5.3.8 JavaScript link -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- fontawesome awesome kit JS code -->
    <script
      src="https://kit.fontawesome.com/8da35863e9.js"
      crossorigin="anonymous"
    ></script>

    <!-- Javascript Code for Memory Monkey Game Page -->
    <script src="assets/js/myscript.js"></script>
  </body>
</html>
